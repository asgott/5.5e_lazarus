<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lazarus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Everything that sits on the sheet lives INSIDE #sheet -->
  <div id="sheet">
    <img id="bg" src="lazarus1.png" alt="Character sheet" draggable="false">

    <!-- Future overlays go here. Example:
    <button class="hotspot" style="left:10%; top:20%; width:15%; height:3%;"></button>
    -->
  </div>

  <!-- Fixed dice roller -->
  <div id="roller">
    <div id="dice-choices">
      <button class="die" data-sides="4">d4</button>
      <button class="die" data-sides="6">d6</button>
      <button class="die" data-sides="8">d8</button>
      <button class="die" data-sides="10">d10</button>
      <button class="die" data-sides="12">d12</button>
      <button class="die selected" data-sides="20">d20</button>
      <button class="die" data-sides="100">d100</button>
    </div>
    <div id="roll-row">
      <button id="roll-btn">Roll</button>
      <div id="result">–</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
